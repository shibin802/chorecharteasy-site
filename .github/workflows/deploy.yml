name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build minimal Pages artifact
        run: |
          python3 backend/scripts/build_pages_artifact.py dist
          rm -rf .wrangler/pages-functions-build
          npx --yes wrangler@4.80.0 pages functions build functions \
            --outdir .wrangler/pages-functions-build \
            --build-output-directory dist \
            --output-routes-path dist/_routes.json \
            --compatibility-date 2026-04-08
          cp .wrangler/pages-functions-build/index.js dist/_worker.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=chorecharteasy --branch=main --commit-hash="${{ github.sha }}" --commit-message="${{ github.event.head_commit.message }}"
