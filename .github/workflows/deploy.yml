name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build minimal Pages artifact
        run: |
          python3 backend/scripts/build_pages_artifact.py dist
          rm -rf .wrangler/pages-functions-build
          npx --yes wrangler@4.80.0 pages functions build functions \
            --outdir .wrangler/pages-functions-build \
            --build-output-directory dist \
            --output-routes-path dist/_routes.json \
            --compatibility-date 2026-04-08
          cp .wrangler/pages-functions-build/index.js dist/_worker.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.80.0
          command: pages deploy dist --project-name=chorecharteasy --branch="${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}" --commit-hash="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}" --commit-message="GitHub Actions deploy" --commit-dirty=false
