<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ChoreChartEasy printable chore chart maker</title>
  <desc id="desc">A warm cream social card with a printable weekly chore chart preview.</desc>
  <rect width="1200" height="630" fill="#F6F1E7"/>
  <circle cx="1090" cy="90" r="170" fill="#F2C8B5" opacity=".58"/>
  <circle cx="120" cy="590" r="190" fill="#BBD9D0" opacity=".62"/>

  <g transform="translate(70 60)">
