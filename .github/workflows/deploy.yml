name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and verify
        run: |
          npm ci
          npm run check

      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            database="chorecharteasy-preview"
          else
            database="chorecharteasy-production"
          fi
          for migration in backend/migrations/0001_initial.sql backend/migrations/0002_feedback.sql backend/migrations/0003_google_auth.sql backend/migrations/0004_stripe_test.sql backend/migrations/0005_subscriptions.sql backend/migrations/0006_checkout_attempts.sql backend/migrations/0007_refund_requests.sql backend/migrations/0008_user_activity.sql backend/migrations/0009_feedback_contacts.sql; do
            npx --yes wrangler@4.80.0 d1 execute "$database" --remote --file="$migration"
          done
          npx --yes wrangler@4.80.0 d1 execute "$database" --remote --command="PRAGMA table_info(feedback_submissions)" --json > /tmp/feedback-columns.json
          has_email=$(python3 -c 'import json; data=json.load(open("/tmp/feedback-columns.json")); print(int(any(row["name"] == "email" for result in data for row in result["results"])))')
          if [ "$has_email" = "0" ]; then
            npx --yes wrangler@4.80.0 d1 execute "$database" --remote --file=backend/migrations/0010_feedback_email.sql
          fi
          npx --yes wrangler@4.80.0 d1 execute "$database" --remote --file=backend/migrations/0011_feedback_email_sync.sql

      - name: Build minimal Pages artifact
        run: |
          python3 backend/scripts/build_pages_artifact.py dist
          rm -rf .wrangler/pages-functions-build
          npx --yes wrangler@4.80.0 pages functions build functions \
            --outdir .wrangler/pages-functions-build \
            --build-output-directory dist \
            --output-routes-path dist/_routes.json \
            --compatibility-date 2026-04-08
          cp .wrangler/pages-functions-build/index.js dist/_worker.js

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.80.0
          command: pages deploy dist --project-name=chorecharteasy --branch="${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}" --commit-hash="${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}" --commit-message="GitHub Actions deploy" --commit-dirty=false
