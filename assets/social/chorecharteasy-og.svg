      <rect x="286" width="150" height="45" rx="22.5" fill="#FFFDF7" stroke="#6B746F" stroke-width="2"/>
      <text x="361" y="29" fill="#3F4B46" text-anchor="middle">Letter + A4</text>
    </g>
  </g>

